services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ai_slack_bot_app

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

  nginx:
    image: nginx:latest

    container_name: ai_slack_bot_nginx

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  mysql:
    image: mysql:8.4

    container_name: ai_slack_bot_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_slack_bot
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7

    container_name: ai_slack_bot_redis

    ports:
      - "6379:6379"

volumes:
  mysql_data:
